name: Build GBAStation YabaSanshiro Switch core

on:
  push:
    branches: [master, main]
    tags: ['v*']
    paths:
      - 'yabause/**'
      - '.github/workflows/build-switch.yml'
  pull_request:
    paths:
      - 'yabause/**'
      - '.github/workflows/build-switch.yml'
  workflow_dispatch:

jobs:
  build-switch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake git ninja-build

      - name: Build NRO
        run: |
          cmake -Wno-dev -S yabause -B build-switch -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=src/nx/nx-toolchain.cmake \
            -DYAB_PORTS=nx \
            -DYAB_WANT_C68K=FALSE \
            -DSH2_DYNAREC=FALSE \
            -DYAB_WANT_DYNAREC_DEVMIYAX=OFF
          cmake --build build-switch --target GBAStationYabaSanshiroStub --parallel 2

      - uses: actions/upload-artifact@v4
        with:
          name: GBAStationYabaSanshiroStub
          path: |
            build-switch/GBAStationYabaSanshiroStub.nro
            build-switch/GBAStationYabaSanshiroStub.nso
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-switch/GBAStationYabaSanshiroStub.nro
